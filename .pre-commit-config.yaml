repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace  # Removes trailing whitespace
        # Snapshots are mento's output byte for byte, trailing spaces included.
        exclude: ^tests/reports/snapshots/
      - id: end-of-file-fixer    # Ensures files end with a newline
        exclude: ^tests/reports/snapshots/
      - id: check-yaml           # Validates YAML files
        # The conda recipe is a Jinja template, not plain YAML — `{% set %}` at
        # the top of the file is not something a YAML parser can read.
        exclude: ^conda-recipe/meta\.yaml$
      - id: check-toml           # Validates TOML files
      - id: check-merge-conflict # Catches merge conflict markers
      - id: check-added-large-files
        args: ["--maxkb=2000"]
  # Keep this version in the same series as the `ruff` pin in requirements_dev.txt,
  # so the hook, CI and a local `ruff format` all agree on the formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
