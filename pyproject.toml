[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mento"
version = "1.5.0"
description = "An intuitive tool for structural engineers to design concrete elements efficiently."
readme = "README.md"
authors = [
    {name = "Mehdí Caballero", email = "mihdicaballero@gmail.com"},
    {name = "Juan Pablo Romaris", email="jpromaris@yahoo.com.ar"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.12"
keywords = [
    "concrete design",
    "structural engineering",
    "reinforced concrete",
    "ACI 318",
    "Eurocode 2",
    "CIRSOC 201",
]
dependencies = [
    "pint>=0.24",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tabulate>=0.9",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    # Google Colab pins ipython to 7.34.0, so a >=8.0 floor made `pip install mento`
    # there either fail to resolve or force an upgrade that breaks the session. mento
    # only uses IPython.display.Markdown and display, which have been stable for far
    # longer than either bound.
    "IPython>=7.34",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "mento[test]",
    "ruff>=0.15.22,<0.17",
    "mypy>=1.15",
    "pandas-stubs",
    "types-tabulate",
    "pre-commit",
    "devtools",
    "ipykernel",
]
docs = [
    "sphinx>=7.2",
    "nbsphinx>=0.9",
    "sphinx-book-theme>=1.1",
    "sphinx-copybutton",
    "sphinx-design",
    "ipykernel",
    "jupyter-client",
    "pygments>=2.4",
]

[project.urls]
Homepage = "https://github.com/mento-calc/mento"
Documentation = "https://mento-docs.readthedocs.io/"
Repository = "https://github.com/mento-calc/mento"
Issues = "https://github.com/mento-calc/mento/issues"
Changelog = "https://github.com/mento-calc/mento/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
# Discovered rather than listed: the roadmap adds one subpackage per design code
# (equations/, later checker.py), and an explicit list that silently ships a
# wheel missing one of them is a failure mode worth designing out.
include = ["mento*"]

[tool.ruff]
# Markdown is excluded because ruff 0.16 started formatting the python code
# blocks inside it. The formatter is here for the package's source, and letting
# a tool upgrade quietly start rewriting prose files is not what we want.
# `_wip/` is branch-local working material with committed notebook outputs; it goes
# away with the directory, before the PR is merged.
extend-exclude = ["build/", "dist/", "*.md", "_wip/"]
show-fixes = true
line-length = 120

[tool.ruff.lint]
# Pinned explicitly so a new ruff release cannot change the rule set under CI.
# These are the rules ruff enabled by default up to 0.15.x; 0.16 widened the
# defaults to UP, RUF, I, B, RET, PL, SIM and more, which fails on this repo.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
packages = ["mento"]
# Matches the minimum supported version.
python_version = "3.12"
strict = true
allow_any_generics = true
ignore_missing_imports = true
# pint's arithmetic on Quantity is typed as returning Any, so nearly every
# property that computes a physical quantity would trip warn_return_any.
warn_return_any = false

# Modules that do not pass strict type checking yet. Continuous integration
# enforces mypy on everything else, so already-clean modules cannot regress.
# When you clean one of these up, delete its entry — do not add new ones.
[[tool.mypy.overrides]]
module = [
    "mento.beam",
    "mento.beam_summary",
    "mento.codes.ACI_318_19_beam",
    "mento.codes.ACI_318_19_wall",
    "mento.codes.EN_1992_2004_beam",
    "mento.node",
    "mento.rebar",
    "mento.results",
    "mento.shear_wall",
    "mento.slab",
    "mento.units",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=mento --cov-report=html --cov-report=term-missing -v"
testpaths = [
    "tests",
]
markers = [
    "published_example: reproduces a case published outside mento -- a worked example of a code, design guide or textbook, a software verification manual, or a recorded ETABS run; a Calcpad sheet alone does not count; the docstring says where in that document the number is, in a paragraph that starts with 'Source:' (tests/architecture/test_published_examples.py checks it); the release workflow counts these for the home page of mento-web",
]
