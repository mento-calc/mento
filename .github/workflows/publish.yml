name: Publish

# Publishes to PyPI when a GitHub Release is published.
#
# Authentication uses PyPI trusted publishing, so no API token is stored in the
# repository. It has to be configured once on PyPI, under the project's
# Publishing settings, with:
#   owner        mento-calc
#   repository   mento
#   workflow     publish.yml
#   environment  pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Verify the built version matches the release tag
        if: github.event_name == 'release'
        run: |
          release_tag="${GITHUB_REF_NAME#v}"
          built_version=$(ls dist/*.tar.gz | sed -E 's/.*mento-(.*)\.tar\.gz/\1/')
          echo "Release tag: $release_tag / built version: $built_version"
          if [ "$release_tag" != "$built_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in pyproject.toml ($built_version)"
            exit 1
          fi

      - name: Install the built wheel and import the package
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/python -c "import mento; print('mento', mento.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Only a published GitHub Release uploads to PyPI. Running the workflow by
    # hand builds and verifies the distributions without publishing them.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mento/
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  announce:
    name: Attach stats and notify mento-web
    needs: publish
    # mento-web runs the release from PyPI, so it is only told once that
    # release is there.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload stats.json to the release
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install mento with its test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # The number on the home page of mento-web. It counts the tests marked
      # `published_example` -- the ones that reproduce a case validated outside
      # mento: a published example or design guide, a software verification
      # manual, a recorded ETABS run, each citing the page or row of its source
      # in its docstring; a Calcpad sheet alone does not count
      # (tests/architecture/test_published_examples.py). It is only ever that count: with
      # nothing marked it publishes 0 and warns, never the size of the whole
      # suite, which is not what the number means. Collecting imports every
      # test module, which is why mento is installed.
      - name: Count the tests
        id: count
        run: |
          # pytest exits 0 with the marked ids on stdout and 5 when nothing is
          # marked; anything else (2: a module fails to import, 4: a bad -m
          # expression) is an error, and it fails the release instead of
          # shrinking or inflating the count.
          set +e
          python -m pytest --collect-only -q --override-ini="addopts=" -m published_example > marked.txt
          status=$?
          set -e
          case "$status" in
            0) tests=$(grep -c '::' marked.txt || true) ;;
            5) tests=0 ;;
            *)
              cat marked.txt
              echo "::error::pytest --collect-only -m published_example exited with status $status"
              exit "$status"
              ;;
          esac
          if [ "$tests" -eq 0 ]; then
            echo "::warning::No test is marked published_example; publishing a count of 0."
          fi
          echo "Counted $tests tests (published_example)"
          printf '{"tests": %d}\n' "$tests" > stats.json
          cat stats.json
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      - name: Attach stats.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" stats.json --clobber

      # Needs the repository secret MENTO_WEB_DISPATCH_TOKEN: a fine-grained
      # personal access token scoped to mento-calc/mento-web with
      # "Contents: read and write", which is what the dispatches endpoint asks
      # for. The workflow's own GITHUB_TOKEN cannot reach another repository.
      - name: Notify mento-web
        env:
          GH_TOKEN: ${{ secrets.MENTO_WEB_DISPATCH_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
          TESTS: ${{ steps.count.outputs.tests }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::MENTO_WEB_DISPATCH_TOKEN is not set; mento-web was not notified."
            exit 0
          fi
          gh api repos/mento-calc/mento-web/dispatches \
            --method POST \
            -f event_type=mento-release \
            -f "client_payload[version]=${VERSION#v}" \
            -F "client_payload[tests]=$TESTS"
